[project]
name = "runpython"
version = "1.0.0"
description = "Executa scripts Python com parâmetros a partir de uma interface Windows."
requires-python = ">=3.9"
dependencies = []  # o app usa só a biblioteca padrão

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
